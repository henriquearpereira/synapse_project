apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapspark-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapspark-frontend
  template:
    metadata:
      labels:
        app: synapspark-frontend
    spec:
      containers:
      - name: synapspark-frontend
        image: teu_usuario/synapspark-frontend:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: synapspark-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: synapspark-frontend
